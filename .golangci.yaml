# golangci-lint configuration for prose.
#
# golint-sl runs as a module plugin baked into ./custom-gcl (see .custom-gcl.yml).
# The prebuilt golangci-lint cannot load the plugin, so run it with
# `mise run lint`, which builds custom-gcl and runs it.
# https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 10m
  tests: true
  modules-download-mode: readonly
  # The integration tests against envtest sit behind this tag.
  build-tags:
    - envtest

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  enable:
    # Default linters
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Additional recommended linters
    - dogsled
    - copyloopvar
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - misspell
    - modernize
    - nakedret
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - whitespace
    - unconvert
    - unparam

    # golint-sl: production-ready Go patterns (error handling, observability, safety)
    # https://golint.specht-labs.de/
    - golint-sl

  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    govet:
      enable-all: true
    misspell:
      locale: US
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    custom:
      golint-sl:
        type: module
        description: SpechtLabs Go linter collection for production-ready code
        original-url: github.com/spechtlabs/golint-sl

  exclusions:
    generated: lax
    rules:
      # Hold test files to a lighter bar than production code.
      - linters:
          - gosec
          - goconst
          - golint-sl
        path: _test\.go

      # Test tables and fixtures are laid out for readability rather than size.
      - linters:
          - govet
        text: "^fieldalignment:"
        path: _test\.go

      # The public API: Otel, WideEvents and Recorder are the documented option
      # names (internal/observability defines them, pkg/prose re-exports them,
      # and ObservabilityOption is an alias of that func type, which the check
      # misreads). IgnoreStatusOnlyUpdates returns predicate.Predicate, the type
      # Builder.WithPredicates and controller-runtime's own predicates use.
      # Renaming or retyping any of them breaks every operator built on prose.
      - linters:
          - golint-sl
        text: "^(optionspattern|returninterface):"
        path: ^(pkg/prose/prose|internal/observability/options)\.go$

      # Complete and Apply return error like the controller-runtime calls they
      # stand in for (Builder.Complete, Client.Patch), and the errors they pass
      # on already carry advice where prose has any to give.
      - linters:
          - golint-sl
        text: '^humaneerror: exported function "(Complete|Apply)" returns plain'
        path: ^internal/pipeline/(builder|context)\.go$

      # FrameError only names the step: a plain step error has no advice, and
      # generic advice would land in every wide event's <step>.advice field.
      - linters:
          - golint-sl
        text: '^humaneerror: humane\.Wrap\(\) should include at least one advice'
        path: ^internal/observability/errors\.go$

      # A wide event holds whatever a step passes to rctx.Set(key, value any),
      # so its values are untyped by design.
      - linters:
          - golint-sl
        text: "^emptyinterface:"
        path: ^internal/observability/fields\.go$

      # runStep frames a step's error once, with the step name; the group runner,
      # the conflict resolver and execute pass that framed error on to
      # controller-runtime unchanged, so wrapping again would only bury it.
      - linters:
          - golint-sl
        text: "^errorwrap:"
        path: ^internal/pipeline/(context|conflict|runner)\.go$

      # The runner builds the context, the tree nodes and the object it hands
      # to its own methods; returning quietly on nil would hide a bug rather
      # than prevent one.
      - linters:
          - golint-sl
        text: "^nilcheck:"
        path: ^internal/pipeline/

      # The wide event goes through logr, whose key/value pairs are the
      # structured fields; the check looks for zap's field constructors.
      - linters:
          - golint-sl
        text: "^wideevents:"
        path: ^internal/pipeline/runner\.go$

      # The Requeue outcome promises "come back, with the controller's
      # backoff", which only Result.Requeue gives; RequeueAfter is a fixed
      # delay. translate is the one place that maps it, and moving off it
      # changes what the outcome means, so that is a change of its own.
      - linters:
          - staticcheck
        text: 'SA1019: \(sigs\.k8s\.io/controller-runtime\.Result\)\.Requeue is deprecated'
        path: ^internal/pipeline/(outcome|outcome_test|runner_test)\.go$

      # rctx.Apply takes any client.Object and patches it with the client.Apply
      # patch type, which writes the server's answer back into the object.
      # Client.Apply, its replacement, takes an apply configuration and leaves
      # the object alone, so moving to it changes what steps see after Apply;
      # that is a change of its own.
      - linters:
          - staticcheck
        text: 'SA1019: sigs\.k8s\.io/controller-runtime/pkg/client\.Apply is deprecated'
        path: ^internal/pipeline/context\.go$

    paths:
      - third_party$
      - builtin$
      - samples$

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - samples$
