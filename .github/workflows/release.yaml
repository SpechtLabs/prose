name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  packages: write
  pull-requests: write

# Never cancel a release half-way: that can leave a tag published with no
# images. Each push keys on its SHA so each commit gets its own run. Only the
# gate job below cancels anything, and only an older gate.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # The gate: what the release tags, the Go module (go.yaml). The samples ran
  # on the pull request; ci.yaml has them.
  #
  # A push to main that lands while an older push is still in its gate cancels
  # that gate: the older run then skips release-please, which would only find
  # that main has moved on. Nothing after the gate is in the group, so a run
  # that got past its gate publishes to the end.
  go:
    name: Go
    uses: ./.github/workflows/go.yaml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    concurrency:
      group: ${{ github.workflow }}-gate-go-${{ github.ref }}
      cancel-in-progress: true

  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    needs:
      - go
    steps:
      # Renovate automerges in quick succession. A run whose commit is no longer
      # main's tip leaves release-please to the newer run, so a stale run cannot
      # rewrite the release PR behind a newer one.
      - name: Refuse to act unless this run's head is still main's tip
        id: still-current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tip="$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)"
          if [ "$tip" = "${{ github.sha }}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main has moved to $tip since this run started at ${{ github.sha }}; leaving release-please to that run."
          fi

      # GitHub doesn't start workflows for what GITHUB_TOKEN does: a release
      # pull request it opens or updates gets a CI run that waits for
      # approval. RELEASE_PLEASE_TOKEN, a fine-grained personal access token
      # with read and write access to this repository's contents, pull
      # requests and issues, makes the pull request an ordinary one whose CI
      # runs. Without the secret, release-please falls back to GITHUB_TOKEN.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release-please
        if: steps.still-current.outputs.current == 'true'
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}

  # prose is a library: the tag release-please creates is the release, and Go
  # fetches the module from it. The sample operator images are what gets
  # published, tagged with the release's version.
  images:
    name: Sample images
    needs:
      - release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/publish-examples.yaml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
